name: TripGraph CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify FROZEN_CONTROLS.lock integrity
        run: python -c "from eval.run_benchmark import verify_frozen_controls; print('Lock verified:', verify_frozen_controls())"

      - name: Run full test suite with coverage
        run: pytest -v --cov=tripgraph --cov-report=term-missing
