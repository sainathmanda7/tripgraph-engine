<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="TripGraph v7 Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="60%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1F2937" stroke-width="0.7" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Canvas & subtle grid -->
  <rect width="1200" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="13" fill="none" stroke="#30363D" stroke-width="1.5"/>

  <!-- Left Graphic: Dual-Graph Frozen vs Dirty Solver Visual -->
  <g transform="translate(52, 42)">
    <rect x="0" y="0" width="236" height="196" rx="10" fill="#0B0F14" stroke="#30363D" stroke-width="1.2"/>
    <text x="16" y="24" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1">DUAL-GRAPH SOLVER IR</text>

    <!-- Edges -->
    <line x1="56" y1="74" x2="174" y2="74" stroke="#4B5563" stroke-width="1.6" stroke-dasharray="4 3"/>
    <line x1="56" y1="74" x2="56" y2="146" stroke="#38BDF8" stroke-width="1.6" opacity="0.75"/>
    <line x1="174" y1="74" x2="174" y2="146" stroke="#00FF88" stroke-width="2.2"/>
    <line x1="56" y1="146" x2="174" y2="146" stroke="#FACC15" stroke-width="1.8" stroke-dasharray="5 3"/>

    <!-- Frozen Day Nodes (Left) -->
    <circle cx="56" cy="74" r="18" fill="#161B22" stroke="#38BDF8" stroke-width="2"/>
    <text x="56" y="78" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SHA</text>
    <circle cx="56" cy="146" r="18" fill="#161B22" stroke="#38BDF8" stroke-width="2"/>
    <text x="56" y="150" text-anchor="middle" fill="#E6EDF3" font-family="ui-monospace, monospace" font-size="10" font-weight="700">PIN</text>

    <!-- Dirty Solved Nodes (Right) -->
    <circle cx="174" cy="74" r="18" fill="#052E1C" stroke="#00FF88" stroke-width="2.2"/>
    <text x="174" y="78" text-anchor="middle" fill="#00FF88" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SAT</text>
    <circle cx="174" cy="146" r="18" fill="#2A2105" stroke="#FACC15" stroke-width="2.2"/>
    <text x="174" y="150" text-anchor="middle" fill="#FACC15" font-family="ui-monospace, monospace" font-size="10" font-weight="700">K3</text>

    <!-- Factor Node Center -->
    <rect x="97" y="96" width="36" height="24" rx="4" fill="#161B22" stroke="#FACC15" stroke-width="1.4"/>
    <text x="115" y="112" text-anchor="middle" fill="#FACC15" font-family="ui-monospace, monospace" font-size="10" font-weight="700">IR</text>

    <text x="56" y="182" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, monospace" font-size="10">FROZEN (0%)</text>
    <text x="174" y="182" text-anchor="middle" fill="#00FF88" font-family="ui-monospace, monospace" font-size="10">VERIFIED</text>
  </g>

  <!-- Right Title & Identity -->
  <g transform="translate(332, 62)">
    <text x="0" y="0" fill="#00FF88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2.2">NEURO-SYMBOLIC SYSTEMS ENGINE</text>
    <text x="0" y="54" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">TripGraph <tspan fill="#00FF88">v7</tspan></text>
    <rect x="0" y="70" width="790" height="2.5" fill="url(#accentLine)" rx="1"/>
    <text x="0" y="102" fill="#D1D5DB" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">Dual-Model CP-SAT Verifier &amp; Zero-Blast-Radius Incremental Itinerary Re-Planner</text>

    <!-- Telemetry / Capability Pills -->
    <g transform="translate(0, 128)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">
      <rect x="0" y="0" width="166" height="30" rx="6" fill="#052E1C" stroke="#00FF88" stroke-width="1"/>
      <text x="83" y="19" text-anchor="middle" fill="#00FF88">OR-TOOLS CP-SAT</text>

      <rect x="178" y="0" width="174" height="30" rx="6" fill="#2A2105" stroke="#FACC15" stroke-width="1"/>
      <text x="265" y="19" text-anchor="middle" fill="#FACC15">KLEENE K3 ORACLE</text>

      <rect x="364" y="0" width="194" height="30" rx="6" fill="#0D2235" stroke="#38BDF8" stroke-width="1"/>
      <text x="461" y="19" text-anchor="middle" fill="#38BDF8">SIGKILL SUBPROCESS</text>

      <rect x="570" y="0" width="186" height="30" rx="6" fill="#161B22" stroke="#8B949E" stroke-width="1"/>
      <text x="663" y="19" text-anchor="middle" fill="#E6EDF3">0.0% BLAST RADIUS</text>
    </g>
  </g>
</svg>
