[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tripgraph-engine"
version = "0.1.0"
description = "Neuro-Symbolic Itinerary Verifier & Incremental Re-Planner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "ortools>=9.10.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
    "python-dateutil>=2.9.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
